<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="轮毂正面示意">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f8"/>
      <stop offset="0.5" stop-color="#aab4c4"/>
      <stop offset="1" stop-color="#dfe6ef"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#f2f5fa"/>
      <stop offset="1" stop-color="#8e98a8"/>
    </radialGradient>
  </defs>

  <!-- 四角定位刻度（靛蓝） -->
  <g stroke="#8b9bff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M40 64 V40 H64"/>
    <path d="M600 64 V40 H576"/>
    <path d="M40 416 V440 H64"/>
    <path d="M600 416 V440 H576"/>
  </g>

  <!-- 轮胎外圈 -->
  <circle cx="320" cy="240" r="184" fill="none" stroke="url(#rim)" stroke-width="30"/>
  <!-- 轮辋唇边 -->
  <circle cx="320" cy="240" r="158" fill="#0c0e14" fill-opacity="0.5" stroke="#7e8896" stroke-width="3"/>
  <!-- 辐条 -->
  <g transform="translate(320,240)" fill="url(#rim)" stroke="#5d6675" stroke-width="3" stroke-linejoin="round">
    <path d="M -22,62 L -38,-130 L -22,-152 L 22,-152 L 38,-130 L 22,62 Z"/>
    <path d="M -22,62 L -38,-130 L -22,-152 L 22,-152 L 38,-130 L 22,62 Z" transform="rotate(72)"/>
    <path d="M -22,62 L -38,-130 L -22,-152 L 22,-152 L 38,-130 L 22,62 Z" transform="rotate(144)"/>
    <path d="M -22,62 L -38,-130 L -22,-152 L 22,-152 L 38,-130 L 22,62 Z" transform="rotate(216)"/>
    <path d="M -22,62 L -38,-130 L -22,-152 L 22,-152 L 38,-130 L 22,62 Z" transform="rotate(288)"/>
  </g>
  <!-- 中心毂 -->
  <circle cx="320" cy="240" r="58" fill="url(#hub)" stroke="#5d6675" stroke-width="3"/>
  <!-- 中心孔 -->
  <circle cx="320" cy="240" r="20" fill="#10141b" stroke="#7a8493" stroke-width="3"/>
  <!-- 5 螺栓孔（半径 80 正五边形） -->
  <g fill="#151a22" stroke="#6d7682" stroke-width="2">
    <circle cx="320" cy="160" r="11"/>
    <circle cx="396.08" cy="215.28" r="11"/>
    <circle cx="367.04" cy="304.72" r="11"/>
    <circle cx="272.96" cy="304.72" r="11"/>
    <circle cx="243.92" cy="215.28" r="11"/>
  </g>
  <!-- 中心十字准线（靛蓝） -->
  <g stroke="#8b9bff" stroke-width="1.5" opacity="0.7">
    <line x1="320" y1="204" x2="320" y2="276"/>
    <line x1="284" y1="240" x2="356" y2="240"/>
  </g>
  <!-- 标注 -->
  <text x="320" y="448" text-anchor="middle" font-family="'SF Mono',ui-monospace,monospace" font-size="18" letter-spacing="4" fill="#8b9bff">FRONT</text>
</svg>
