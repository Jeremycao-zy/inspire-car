<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="轮毂斜45度示意">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f8"/>
      <stop offset="0.5" stop-color="#aab4c4"/>
      <stop offset="1" stop-color="#dfe6ef"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#f2f5fa"/>
      <stop offset="1" stop-color="#8e98a8"/>
    </radialGradient>
  </defs>

  <!-- 四角定位刻度（靛蓝） -->
  <g stroke="#8b9bff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M40 64 V40 H64"/>
    <path d="M600 64 V40 H576"/>
    <path d="M40 416 V440 H64"/>
    <path d="M600 416 V440 H576"/>
  </g>

  <!-- 桶身侧厚（先画，置于面之后） -->
  <path d="M 420 96 L 486 74 L 486 406 L 420 384 Z" fill="#0c0e14" fill-opacity="0.4" stroke="#7e8896" stroke-width="3"/>
  <!-- 背面轮辋弧（淡） -->
  <path d="M 486 74 A 150 128 0 0 1 486 406" fill="none" stroke="#8e98a8" stroke-width="2" opacity="0.4"/>
  <!-- 正面轮辋面 -->
  <ellipse cx="300" cy="240" rx="128" ry="150" fill="#0c0e14" fill-opacity="0.5" stroke="url(#rim)" stroke-width="22"/>
  <!-- 辐条（5，截断在椭圆内） -->
  <g stroke="#aab4c4" stroke-width="10" stroke-linecap="round" opacity="0.9">
    <line x1="300" y1="240" x2="300" y2="100"/>
    <line x1="300" y1="240" x2="411" y2="148"/>
    <line x1="300" y1="240" x2="411" y2="332"/>
    <line x1="300" y1="240" x2="189" y2="332"/>
    <line x1="300" y1="240" x2="189" y2="148"/>
  </g>
  <!-- 中心毂 -->
  <ellipse cx="300" cy="240" rx="26" ry="30" fill="url(#hub)" stroke="#5d6675" stroke-width="3"/>
  <ellipse cx="300" cy="240" rx="9" ry="11" fill="#10141b" stroke="#7a8493" stroke-width="2"/>
  <!-- 中轴准线（靛蓝） -->
  <g stroke="#8b9bff" stroke-width="1.5" opacity="0.6">
    <line x1="300" y1="206" x2="300" y2="274"/>
    <line x1="266" y1="240" x2="334" y2="240"/>
  </g>
  <!-- 标注 -->
  <text x="330" y="448" text-anchor="middle" font-family="'SF Mono',ui-monospace,monospace" font-size="18" letter-spacing="3" fill="#8b9bff">3/4 VIEW</text>
</svg>
