<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480" role="img" aria-label="轮毂侧面示意">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2f8"/>
      <stop offset="0.5" stop-color="#aab4c4"/>
      <stop offset="1" stop-color="#dfe6ef"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.85">
      <stop offset="0" stop-color="#f2f5fa"/>
      <stop offset="1" stop-color="#8e98a8"/>
    </radialGradient>
  </defs>

  <!-- 四角定位刻度（靛蓝） -->
  <g stroke="#8b9bff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.9">
    <path d="M40 64 V40 H64"/>
    <path d="M600 64 V40 H576"/>
    <path d="M40 416 V440 H64"/>
    <path d="M600 416 V440 H576"/>
  </g>

  <!-- 轮胎侧剖轮廓（竖向胶囊） -->
  <rect x="274" y="100" width="92" height="280" rx="46" fill="#0c0e14" fill-opacity="0.5" stroke="url(#rim)" stroke-width="22"/>
  <!-- 轮辋桶身（内 concentric 胶囊） -->
  <rect x="292" y="124" width="56" height="232" rx="28" fill="none" stroke="#7e8896" stroke-width="3"/>
  <!-- 轮辋前后分面线 -->
  <line x1="320" y1="124" x2="320" y2="356" stroke="#5d6675" stroke-width="1.5" opacity="0.5"/>
  <!-- 中心毂（侧视：竖向椭圆 + 螺栓轴） -->
  <ellipse cx="320" cy="240" rx="20" ry="30" fill="url(#hub)" stroke="#5d6675" stroke-width="3"/>
  <circle cx="320" cy="240" r="8" fill="#10141b" stroke="#7a8493" stroke-width="2"/>
  <!-- 螺栓轴刻度 -->
  <g stroke="#6d7682" stroke-width="2" opacity="0.8">
    <line x1="320" y1="212" x2="320" y2="268"/>
  </g>
  <!-- 宽度标注（靛蓝） -->
  <g stroke="#8b9bff" stroke-width="1.5" opacity="0.85" fill="none">
    <line x1="274" y1="406" x2="366" y2="406"/>
  </g>
  <path d="M274 406 l9 -5 v10 z" fill="#8b9bff"/>
  <path d="M366 406 l-9 -5 v10 z" fill="#8b9bff"/>
  <text x="320" y="426" text-anchor="middle" font-family="'SF Mono',ui-monospace,monospace" font-size="14" letter-spacing="2" fill="#8b9bff">W</text>
  <!-- 标注 -->
  <text x="320" y="454" text-anchor="middle" font-family="'SF Mono',ui-monospace,monospace" font-size="18" letter-spacing="4" fill="#8b9bff">PROFILE</text>
</svg>
