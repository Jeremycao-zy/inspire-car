<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 首屏关键 CSS：在 JS 注入的样式表生效前，先把品牌启动页画成纯黑全屏 + 新字标，
         避免裸 HTML 闪现。appbar 被全屏 brand-loading 盖住，不闪。
         动画内联自包含：即便 styles.css（JS 注入）尚未加载也好看，彻底摆脱网络时序割裂。
         参数须与 styles.css 的品牌启动页区块一致，避免样式表接管时观感跳变。 -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      #brand-loading {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #000;
      }
      .brand-loading__inner { display: flex; flex-direction: column; align-items: center; }
      .brand-loading__logo {
        width: min(560px, 74vw); height: auto;
        user-select: none; pointer-events: none;
        animation:
          blLogoIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) both,
          blGlow 3.2s ease-in-out 1.2s infinite;
        will-change: opacity, transform;
      }
      .brand-loading__tag {
        margin-top: 34px;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', sans-serif;
        font-size: 11px; font-weight: 500;
        letter-spacing: 0.55em; padding-left: 0.55em; /* 追踪字距后视觉居中 */
        color: rgba(255, 255, 255, 0.42);
        white-space: nowrap; user-select: none;
        animation: blTagIn 1.2s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
      }
      .brand-loading__tag i { font-style: normal; margin: 0 1.5em; color: rgba(255, 255, 255, 0.18); }
      .brand-loading__horizon {
        margin-top: 52px;
        width: min(760px, 84vw); height: 1px;
        background: linear-gradient(90deg,
          transparent, rgba(255, 255, 255, 0.28) 22%, rgba(255, 255, 255, 0.7) 50%,
          rgba(255, 255, 255, 0.28) 78%, transparent);
        box-shadow: 0 0 24px rgba(255, 255, 255, 0.16);
        animation: blHorizon 1.6s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes blLogoIn {
        from { opacity: 0; transform: scale(0.97); }
        to   { opacity: 1; transform: scale(1); }
      }
      @keyframes blGlow { 0%, 100% { opacity: 0.88; } 50% { opacity: 1; } }
      @keyframes blTagIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes blHorizon {
        from { opacity: 0; transform: scaleX(0.6); }
        to   { opacity: 1; transform: scaleX(1); }
      }
      /* 首屏先藏顶部栏，等样式表接管后再由应用逻辑显示，避免未样式化大 logo 闪现 */
      #appbar { display: none; }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/logo-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="灵感改装" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />

    <!-- 品牌字体：Inter（拉丁，宽字距排版）+ Noto Sans SC（中文）。首屏关键资源，preconnect 加速 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />

    <title>灵感改装 · INSPIRE CAR · 汽车改装 3D 预览</title>
  </head>
  <body>
    <!-- 品牌启动页：纯黑全屏 + 新字标 + 品牌标语 + 地平线光效 -->
    <div id="brand-loading" class="brand-loading" aria-hidden="true">
      <div class="brand-loading__inner">
        <img class="brand-loading__logo" src="/src/assets/logo-wordmark-white.png" alt="INSPIRE CAR" />
        <div class="brand-loading__tag">MODIFY<i>×</i>EXPLORE<i>×</i>BEYOND</div>
        <div class="brand-loading__horizon"></div>
      </div>
    </div>

    <div id="app">
      <!-- 第二层（TUNING STUDIO）顶部返回栏：返回灵感车库并保存方案 -->
      <header id="appbar">
        <div class="appbar-left">
          <img class="appbar-logo" src="/src/assets/logo-wordmark-white.png" alt="INSPIRE CAR" />
          <span class="appbar-title">INSPIRE CAR</span>
          <span class="appbar-sep">/</span>
          <span class="appbar-loc">TUNING STUDIO</span>
        </div>
        <button id="back-to-garage" class="gb-back" type="button">
          <svg class="gb-back__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          <span>返回车库</span>
        </button>
      </header>

      <div class="app-body">
        <!-- 左侧控制面板 -->
        <aside id="sidebar"></aside>

        <!-- 3D 视口 -->
        <main id="stage">
          <div id="overlay">
            <div id="model-loading-3d" class="loading3d-host"></div>
            <div class="spinner" aria-hidden="true"></div>
            <div id="overlay-text">初始化…</div>
          </div>

          <div id="hud">
            <div class="hud-title">左键拖拽旋转 ｜ 滚轮缩放 ｜ 右键平移</div>
            <div class="hud-hint">
              上传整车照片 → 自动生成 GLB；上传轮毂照片 → 自动装配 4 只；
              拖滑杆 ET / J / 倾角，3D 里实时变化
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- 灵感车库：第一层入口页 -->
    <div id="garage" class="garage-layer"></div>

    <!-- 拍照引导：新建方案后先拍摄 5 个角度，再进入建模 -->
    <div id="photo-guide" class="photo-guide-layer hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
