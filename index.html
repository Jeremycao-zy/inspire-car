<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 首屏关键 CSS：在 JS 注入的样式表生效前，先把品牌启动页画成黑底居中、logo 定尺寸，
         避免裸 HTML 闪现（白底 + 两个未样式化的大 logo）。appbar 被全屏 brand-loading 盖住，不闪。 -->
    <style>
      html, body { margin: 0; height: 100%; background: #000; }
      #brand-loading {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; align-items: center; justify-content: center;
        background: #000;
      }
      .brand-loading__inner { display: flex; flex-direction: column; align-items: center; gap: 24px; }
      .brand-loading__logo {
        width: 84px; height: 84px; object-fit: contain;
        filter: brightness(0) invert(1) drop-shadow(0 0 10px rgba(0, 240, 255, 0.5));
        opacity: 0.6;
        /* 启动页动画内联自包含：即便 styles.css（JS 注入）尚未加载也好看，彻底摆脱网络时序割裂 */
        animation: blLogo 2.2s ease-in-out infinite;
      }
      .brand-loading__text {
        font-family: 'Share Tech Mono', 'SF Mono', 'Menlo', monospace;
        font-size: 28px; letter-spacing: 0.32em; color: rgba(255, 255, 255, 0.35);
        text-transform: uppercase; white-space: nowrap; user-select: none;
      }
      .brand-loading__text span {
        display: inline-block;
        opacity: 0.5;
        color: #fff;
        text-shadow: 0 0 10px rgba(0,240,255,0.6), 0 0 22px rgba(0,240,255,0.3);
        animation: blLetter 2.2s ease-in-out infinite;
        animation-delay: calc(var(--i) * 0.12s);
      }
      .brand-loading__space { animation: none !important; }
      @keyframes blLogo { 0%,100% { opacity: 0.55; } 50% { opacity: 1; } }
      @keyframes blLetter { 0%,100% { opacity: 0.45; } 50% { opacity: 1; } }
      /* 首屏先藏顶部栏，等样式表接管后再由应用逻辑显示，避免未样式化大 logo 闪现 */
      #appbar { display: none; }
    </style>
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/logo-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/logo-180.png" />

    <!-- 复古电子 / 像素 + 霓虹赛博 字体（首屏关键资源，preconnect 加速） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <title>灵感改装 · INSPIRE CAR · 汽车改装 3D 预览</title>
  </head>
  <body>
    <!-- 品牌启动页：首页资源就绪前显示，logo + 英文名逐字霓虹闪动 -->
    <div id="brand-loading" class="brand-loading" aria-hidden="true">
      <div class="brand-loading__inner">
        <img class="brand-loading__logo" src="/src/assets/logo-mark-nobg.png" alt="" />
        <div class="brand-loading__text" aria-label="INSPIRE CAR">
          <span style="--i:0">I</span>
          <span style="--i:1">N</span>
          <span style="--i:2">S</span>
          <span style="--i:3">P</span>
          <span style="--i:4">I</span>
          <span style="--i:5">R</span>
          <span style="--i:6">E</span>
          <span class="brand-loading__space"></span>
          <span style="--i:7">C</span>
          <span style="--i:8">A</span>
          <span style="--i:9">R</span>
        </div>
      </div>
    </div>

    <div id="app">
      <!-- 第二层（TUNING STUDIO）顶部返回栏：返回灵感车库并保存方案 -->
      <header id="appbar">
        <div class="appbar-left">
          <img class="appbar-logo" src="/src/assets/logo-mark-nobg.png" alt="INSPIRE CAR" />
          <span class="appbar-title">INSPIRE CAR</span>
          <span class="appbar-sep">/</span>
          <span class="appbar-loc">TUNING STUDIO</span>
        </div>
        <button id="back-to-garage" class="gb-back" type="button">
          <svg class="gb-back__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          <span>返回车库</span>
        </button>
      </header>

      <div class="app-body">
        <!-- 左侧控制面板 -->
        <aside id="sidebar"></aside>

        <!-- 3D 视口 -->
        <main id="stage">
          <div id="overlay">
            <div class="spinner"></div>
            <div id="overlay-text">初始化…</div>
          </div>

          <div id="hud">
            <div class="hud-title">左键拖拽旋转 ｜ 滚轮缩放 ｜ 右键平移</div>
            <div class="hud-hint">
              上传整车照片 → 自动生成 GLB；上传轮毂照片 → 自动装配 4 只；
              拖滑杆 ET / J / 倾角，3D 里实时变化
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- 灵感车库：第一层入口页 -->
    <div id="garage" class="garage-layer"></div>

    <!-- 拍照引导：新建方案后先拍摄 5 个角度，再进入建模 -->
    <div id="photo-guide" class="photo-guide-layer hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
