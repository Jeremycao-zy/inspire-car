<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/logo-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/assets/logo-180.png" />

    <!-- 复古电子 / 像素 + 霓虹赛博 字体（首屏关键资源，preconnect 加速） -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;500;700;900&display=swap"
      rel="stylesheet"
    />

    <title>灵感改装 · INSPIRE CAR · 汽车改装 3D 预览</title>
  </head>
  <body>
    <div id="app">
      <!-- 第二层（TUNING STUDIO）顶部返回栏：返回灵感车库并保存方案 -->
      <header id="appbar">
        <div class="appbar-left">
          <img class="appbar-logo" src="/src/assets/logo-mark-nobg.png" alt="INSPIRE CAR" />
          <span class="appbar-title">INSPIRE CAR</span>
          <span class="appbar-sep">/</span>
          <span class="appbar-loc">TUNING STUDIO</span>
        </div>
        <button id="back-to-garage" class="gb-back" type="button">
          <svg class="gb-back__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/>
            <polyline points="17 21 17 13 7 13 7 21"/>
            <polyline points="7 3 7 8 15 8"/>
          </svg>
          <span>返回车库</span>
        </button>
      </header>

      <div class="app-body">
        <!-- 左侧控制面板 -->
        <aside id="sidebar"></aside>

        <!-- 3D 视口 -->
        <main id="stage">
          <div id="overlay">
            <div class="spinner"></div>
            <div id="overlay-text">初始化…</div>
          </div>

          <div id="hud">
            <div class="hud-title">左键拖拽旋转 ｜ 滚轮缩放 ｜ 右键平移</div>
            <div class="hud-hint">
              上传整车照片 → 自动生成 GLB；上传轮毂照片 → 自动装配 4 只；
              拖滑杆 ET / J / 倾角，3D 里实时变化
            </div>
          </div>
        </main>
      </div>
    </div>

    <!-- 灵感车库：第一层入口页 -->
    <div id="garage" class="garage-layer"></div>

    <!-- 拍照引导：新建方案后先拍摄 5 个角度，再进入建模 -->
    <div id="photo-guide" class="photo-guide-layer hidden"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
