# 灵感改装 / Inspire Car — Fly.io 部署配置（基础设施即代码）
# 文档: https://fly.io/docs/reference/configuration/
#
# 说明：
# - 与 Railway 完全等价：单端口全栈（server 同时服务 dist/ 静态产物 + /api/*），只暴露一个端口。
# - 节点选 sin（新加坡）：香港 hkg 已被 Fly 停用、新资源不可建；sin/nrt 是国内延迟最低的可用地域。
# - 敏感 key（HYPER3D_API_KEY / HUNYUAN3D_TOKEN / QWEN_API_KEY）用 `fly secrets set` 设置，
#   绝不写进本文件或 git 仓库。
# - 免费额度：shared-cpu-1x + 256MB，min_machines_running=1 → 永久常驻、不休眠、不收钱。

app = "inspire-car"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  # 设为 0 → 空闲自动停机（scale to zero）：只在实际访问时按秒计费，空闲不花计算费，
  # 仅少量存储费（约几分钱/月）→ 基本等于免费。代价：闲置后首访有几秒冷启动。
  # 若要 24h 常驻不休眠，改回 1（但会产生按月计算费，约 $2–5/月）。
  min_machines_running = 0

[env]
  # 非敏感：容器必须监听所有网卡，否则外部访问不到
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  SERVE_STATIC = "1"
  SPA_FALLBACK = "1"
  PORT = "8080"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
